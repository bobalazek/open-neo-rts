name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's changed files through the API
    outputs:
      content: ${{ steps.filter.outputs.content }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            content:
              - 'content/**'
              - 'packages/content/**'
              - 'apps/cli/**'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Renderer tests read these five GLBs; keep every other LFS asset skipped.
      - name: Pull renderer test fixtures
        run: git lfs pull --include="content/core/factions/eastern-collective/units/collective-soldier/collective-soldier.glb,content/core/factions/eastern-collective/units/dragon-tank/dragon-tank.glb,content/core/factions/eastern-collective/units/gunboat/gunboat.glb,content/core/factions/eastern-collective/structures/radar-tower/radar-tower.glb,content/core/resources/ore-cell/ore-cell.glb" --exclude=""
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun neo generate-schemas --check

  # Cross-engine determinism: the same golden digests in Chromium, Firefox and WebKit as in Bun.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull model-check fixtures
        run: git lfs pull --include="content/core/factions/eastern-collective/units/dragon-tank/dragon-tank.glb,content/core/factions/eastern-collective/units/infiltrator/infiltrator.glb,content/core/factions/eastern-collective/units/flame-tank/flame-tank.glb,content/core/factions/alliance-of-free-nations/units/tactical-operator/tactical-operator.glb,content/core/factions/phoenix-initiative/units/insurgent/insurgent.glb,content/core/factions/eastern-collective/structures/radar-tower/radar-tower.glb,content/core/props/urban/bench/bench.glb,content/core/maps/**/*.r8,content/core/resources/ore-cell/ore-cell.glb,content/core/resources/material-node/material-node.glb"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bunx tsc -p apps/web/e2e/tsconfig.json
      - run: bun run test:browsers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: determinism-traces
          path: test-results/
          retention-days: 14

  content:
    needs: changes
    if: needs.changes.outputs.content == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore LFS cache
        id: lfs
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun neo validate
