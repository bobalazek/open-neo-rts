name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's changed files through the API
    outputs:
      content: ${{ steps.filter.outputs.content }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            content:
              - 'content/**'
              - 'packages/content/**'
              - 'apps/cli/**'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The normal setup regression resolves the real catalog and hashes original runtime bytes.
      - name: Pull original core content
        run: git lfs pull --include="content/core/**" --exclude=""
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Ensure audio validation tool
        run: |
          if ! command -v ffmpeg; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun neo generate-schemas --check

  # Current Chrome stable and current Playwright WebKit; one setup per browser.
  browsers:
    name: Browser (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            project: chromium
            os: ubuntu-latest
          - browser: webkit
            project: webkit
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull original core content for normal catalog identity and browser models
        run: git lfs pull --include="content/core/**" --exclude=""
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Provide software WebGL display
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xauth libgl1-mesa-dri pulseaudio
      - name: Provide virtual audio output
        if: runner.os == 'Linux'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=neo_ci rate=48000
          pactl set-default-sink neo_ci
          pactl info
      - run: bunx tsc -p apps/web/e2e/tsconfig.json
      - name: Run Chrome journeys
        if: matrix.browser == 'chrome'
        run: xvfb-run -a bun run test:browsers --project=${{ matrix.project }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Run WebKit journeys
        if: matrix.browser == 'webkit'
        run: bun run test:browsers --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: key-capture-evidence-${{ matrix.browser }}
          path: test-results/**/key-capture-*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: determinism-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 14

  content:
    needs: changes
    if: needs.changes.outputs.content == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore LFS cache
        id: lfs
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Ensure audio validation tool
        run: |
          if ! command -v ffmpeg; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: bun neo validate
