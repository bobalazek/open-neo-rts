<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="../../packages/client/src/features/content-editor/content-tools.css" />

    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; display: block; overflow: hidden; background: #111; }
    </style>
  </head>
  <body>
    <!--
    THESIS: A native Babylon Home and a battlefield-first RTS HUD.
    OWN-WORLD: Graphite steel, warm metal command glyphs, authored model portraits,
    thin framed docks, clear numeric counters and no ornamental animation.
    STORY: Home presents an original vector wordmark and the authored Dragon Tank
    in a quiet rotating display; native GUI controls start or resume a local match.
    Keyboard/screen-reader semantics survive through synchronized HTML controls.
    Then read resources, select actors, inspect their real state and issue commands.
    FIRST VIEWPORT: Actual objective upper left; compact clock/speed above and
    icon controls upper right. Stack economy beside the selected actor at the bottom;
    contextual commands, recipes and queues sit alongside. Circular map bottom right.
    Owner/color and clickable model counts identify the selection. Hide its station
    completely when nothing is selected. Keep the battlefield dominant.
    FORM: Owner-requested conventional RTS layout; researched StarCraft II,
    Age of Empires IV and Command & Conquer. Canon overrides seed 2a30a1e2.
    HOME: Graphite navigation, warm metal vector lettering, ivory supporting type,
    real brick model on an octagonal plinth. At narrow widths stack the menu below
    the model. All visible Home controls use Babylon GUI.
    SETUP: Native Babylon fields and framed actions surround compact Force rows
    and a top-down preview of the actual Training Grounds terrain, resources and
    selected spawns. The existing controller owns validation and saved setups.
    Narrow views stack and scroll content while keeping feedback and Start visible.
    PANELS: Shared native graphite panels for device settings, pause actions,
    objectives, controls and named saves. The live match remains dimly visible
    behind its modal canvas; the HTML dialog retains focus and Escape ownership.
    Keep actual preference preview/apply/cancel and paused worker state intact.
    GALLERY: Native save rows show real match thumbnails, names and dates beside
    selected-slot details on desktop; stack and scroll in portrait. Filter and search
    retain focus as rows change. Import, compatibility checks and safe restore stay
    with the existing browser-storage controller, including changed-slot protection.
    RESULTS: Native tabs, metric controls, copied final-value tables and original
    history plots preserve the actual completed match record. Tables scroll without
    dropping rows. Sampled values, replay export, Rematch and Home remain available.
    BATTLEFIELD: Babylon GUI owns the visible HUD on the existing world scene.
    Reuse original pictograms and model thumbnails. Names, health and counts stay
    compact; complete commands, prices, requirements and stats live in hover/focus
    descriptions and Details. Only populated control groups appear by default.
    The circular map contains the whole rotated square map, including its corners.
    Keyboard and assistive controls retain their existing command controllers.
    Geometry guards use CSS pixels even when graphics changes render resolution.
    The menu pins Resume in its header while the remaining actions scroll.
    CONTROLS EXTENSION
    THESIS: Rebind actual match controls while the battlefield keeps its contextual station.
    OWN-WORLD: Inherit graphite native frames, ivory Arial labels and warm-metal actions from Settings.
    STORY: Choose an action, capture keys, resolve conflicts and Apply; Back keeps active controls.
    FIRST VIEWPORT: Fixed Back/title above category/action/slot/preset fields; responsive actions follow, with recovery visible.
    FORM: Inherited measured Settings panel, the only applicable form for this narrow extension.
    Local extensions need no concept roll; no new seed was generated.
    AUDIO EXTENSION
    THESIS: Adjust the actual device mixer from the shared native Settings panel.
    OWN-WORLD: Retain graphite frames, ivory labels and warm-metal controls.
    STORY: Choose channel and level, test and preview; Apply saves and Back restores saved levels.
    FIRST VIEWPORT: Fixed Back/title above channel, volume and mute choices; actions and recovery follow.
    FORM: Inherit the measured native Settings form; no new concept roll or seed.
    WAYPOINTS EXTENSION
    THESIS: Edit a selected actor's pending destination directly on its existing route.
    OWN-WORLD: Keep original terrain, models, cyan route strokes and the native contextual HUD.
    STORY: Hover a small diamond, drag a preview and release to commit; right-click removes the pending order.
    FIRST VIEWPORT: Routes stay in the world; no extra panel or buttons when nothing is selected. Queue controls retain keyboard editing and native tooltips.
    FORM: Inherit the battlefield composition. CSS-pixel hit targets survive graphics scaling; Escape or a HUD drop cancels. Right-drag still pans.
    Local code-led extension; no new concept roll, seed or raster.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <canvas id="game"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
